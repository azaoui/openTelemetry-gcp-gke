# OTel Collector - configuration LOCALE (docker-compose)
# Même structure que la config GKE : seuls les exporters changent.
#   traces  -> Jaeger (UI http://localhost:16686)
#   metrics -> debug (stdout du collector)
#   logs    -> debug (stdout du collector)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  # Supprime les spans des health checks (bruit)
  filter/drop-health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/health"'
  batch:
    timeout: 2s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-health, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

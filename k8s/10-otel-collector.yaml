# =====================================================================
# OpenTelemetry Collector (mode "gateway" : 1 Deployment central)
#   apps --OTLP/HTTP:4318--> collector --> Cloud Trace / Cloud Logging / Managed Prometheus
# Auth vers les APIs Google : Workload Identity (KSA otel/otel-collector, rôles IAM donnés
# directement au principal KSA, pas de clé JSON, pas de GSA).
# =====================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: otel
---
# RBAC requis par le processor k8s_attributes (lecture des métadonnées des pods)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: otel
roleRef:
  kind: ClusterRole
  name: otel-collector
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # 1) Protection mémoire : toujours en PREMIER dans les pipelines
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

      # 2) Supprime les spans des probes kubelet (/health) -> traces plus lisibles
      filter/drop-health:
        error_mode: ignore
        traces:
          span:
            - 'attributes["url.path"] == "/health"'

      # 3) Enrichit avec les métadonnées K8s (pod, deployment, node...)
      #    Le pod émetteur est identifié par l'IP source de la connexion.
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
          labels:
            - tag_name: app
              key: app
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection

      # 4) Détecte projet GCP, zone, nom du cluster via le metadata server
      #    (indispensable pour Managed Prometheus : location + cluster)
      resource_detection:
        detectors: [env, gcp]
        timeout: 5s
        override: false

      # 5) Regroupe les envois (moins d'appels API, meilleur débit)
      batch:
        send_batch_size: 200
        send_batch_max_size: 500
        timeout: 5s

    exporters:
      # Traces -> Cloud Trace ; Logs -> Cloud Logging (corrélés à la trace via trace_id/span_id)
      googlecloud:
        log:
          default_log_name: otel-lab
      # Métriques -> Google Cloud Managed Service for Prometheus
      googlemanagedprometheus: {}
      # Copie résumée dans les logs du collector (debug du lab : kubectl logs)
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/drop-health, k8s_attributes, resource_detection, batch]
          exporters: [googlecloud, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource_detection, batch]
          exporters: [googlemanagedprometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource_detection, batch]
          exporters: [googlecloud]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: otel
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.162.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: otel
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
